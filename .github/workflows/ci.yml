name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref; a stale result is never the one wanted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build and test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor and the next major. A tool that gates other people's
        # installs must not itself be version-fragile.
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit tests with coverage
        run: pnpm run test:coverage

      - name: End-to-end tests
        run: pnpm run test:e2e

      # The tool's central promise is that it never runs analysed code. Assert it
      # from the outside as well as from the unit suite: the canary fixture writes
      # sentinel files from preinstall, postinstall, prepare, `!!js` config, `!!js`
      # disabled, and module top level. Any sentinel on disk after a full analysis
      # means the guarantee is broken, and that is a release blocker, not a warning.
      - name: Non-execution canary
        run: |
          set -euo pipefail
          canary="$(mktemp -d)/sentinel"
          DSH_INSPECTOR_CANARY="$canary" node lib/cli.js tests/fixtures/execution-canary --json > /dev/null
          if [ -e "$canary" ]; then
            echo "::error::analysed code executed during inspection; sentinel says: $(cat "$canary")"
            exit 1
          fi
          echo "no sentinel written - analysed code did not execute"

  package:
    name: package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Catches the class of defect that shipped once already here: a `files`
      # field that publishes fewer modules than the entry point imports.
      - name: publint
        run: pnpm dlx publint --strict

      - name: Are the types wrong?
        run: pnpm dlx @arethetypeswrong/cli --pack --ignore-rules cjs-resolves-to-esm

      # Prove the tarball works standalone, outside this repo's node_modules.
      - name: Install the packed tarball and run it
        run: |
          set -euo pipefail
          pnpm pack --pack-destination /tmp
          tarball="$(ls /tmp/*.tgz)"
          work="$(mktemp -d)"
          cd "$work"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$tarball"
          npx dsh-inspect "$GITHUB_WORKSPACE/tests/fixtures/benign-control" --json > out.json
          node -e "
            const r = require('./out.json');
            if (!Array.isArray(r.findings)) { console.error('no findings array'); process.exit(1) }
            if (r.findings.length !== 0) { console.error('benign control produced findings:', r.findings.length); process.exit(1) }
            console.log('installed tarball ran; benign control clean')
          "
